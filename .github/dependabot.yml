version: 2

updates:
  - package-ecosystem: uv
    directory: /phase-01-foundation
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /phase-01-foundation
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    cooldown:
      default-days: 7