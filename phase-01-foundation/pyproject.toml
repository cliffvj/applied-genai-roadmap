[project]
name = "applied-genai-foundation"
version = "0.1.0"
description = "Foundation API and engineering tooling for the Applied GenAI Roadmap."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Clifford V. Juan" }
]
dependencies = [
    "fastapi>=0.139.2",
    "httpx2>=2.9.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "cyclonedx-bom==7.3.1",
    "hypothesis>=6.163.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applied_genai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["applied_genai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src/applied_genai", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
exclude = [
    "^\\.venv/",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]

strict_config = true
strict_markers = true
strict_xfail = true
strict_parametrization_ids = true

markers = [
    "unit: isolated tests for one function, class, or schema",
    "integration: tests covering multiple application components",
    "contract: tests validating API or external-service contracts",
    "property: property-based tests generated by Hypothesis",
    "slow: tests intentionally excluded from the fast local suite",
]

addopts = [
    "-ra",
    "--showlocals",
    "--durations=10",
    "--cov=applied_genai",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=95",
]

filterwarnings = [
    "error",
]

timeout = 15
session_timeout = 180

[tool.coverage.run]
branch = true
source = ["applied_genai"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_covered = true

exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
